<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}" />

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>

<section>
    <div id="section_wrap">
        <div class="word">
            SIGN-UP RESULT
        </div>
        <div class="content">
            <th:block th:if="${result > 0}">
                SIGN-UP SUCCESS
            </th:block>
            <th:block th:if="${duplicateId}">
                이미 사용 중인 아이디입니다. 다른 아이디를 사용해주세요.
            </th:block>
            <th:block th:if="${result <= 0}">
                <span th:unless="${duplicateId}">SIGN-UP FAIL</span>
            </th:block>
        </div>
    </div>
</section>

<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
