<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/admin-members.css}">
</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}"></header>
<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>

<main class="admin-members">
    <div class="page-heading">
        <div>
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>관리자 계정 조회</h1>
            <p class="page-description">관리자 계정 정보와 접근 권한을 확인합니다.</p>
        </div>
    </div>

    <p class="notice success" th:if="${message}" th:text="${message}"></p>
    <p class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <section class="detail-card">
        <dl class="detail-list">
            <div><dt>회원 번호</dt><dd th:text="${admin.am_no}">1</dd></div>
            <div><dt>아이디</dt><dd th:text="${admin.am_id}">admin</dd></div>
            <div><dt>이름</dt><dd th:text="${admin.am_name}">관리자</dd></div>
            <div><dt>이메일</dt><dd th:text="${admin.am_mail}">admin@example.com</dd></div>
            <div><dt>전화번호</dt><dd th:text="${admin.am_phone}">010-0000-0000</dd></div>
            <div><dt>가입일</dt><dd th:text="${admin.am_reg_date != null ? admin.am_reg_date : '-'}">-</dd></div>
            <div><dt>수정일</dt><dd th:text="${admin.am_mod_date != null ? admin.am_mod_date : '-'}">-</dd></div>
            <div>
                <dt>권한 조합</dt>
                <dd th:text="${permissionLabel}">[]</dd>
            </div>
            <div>
                <dt>권한 관리</dt>
                <dd th:text="${masterRole ? 'Master' : '일반 관리자'}">일반 관리자</dd>
            </div>
        </dl>

        <div class="form-actions">
            <a class="button button-secondary" th:href="@{/admin/members_list}">목록</a>
            <a class="button button-secondary"
               th:if="${canManagePermissions}"
               th:href="@{/admin/members_list/admin/{adminNo}/authority-history(adminNo=${admin.am_no})}">
                권한 변경 이력
            </a>
        </div>
    </section>

    <section class="detail-card" th:if="${canManagePermissions}">
        <h2>관리자 권한 설정</h2>
        <form th:action="@{/admin/members_list/admin/{adminNo}/authority(adminNo=${admin.am_no})}"
              method="post">
            <div class="form-group">
                <label for="permissionRole">권한 조합</label>
                <select id="permissionRole" name="permissionRole" required>
                    <option value="" th:selected="${permissionRole == ''}">권한 없음</option>
                    <option value="control" th:selected="${permissionRole == 'control'}">control — 회원 조회/관제·탐지</option>
                    <option value="control, modify" th:selected="${permissionRole == 'control, modify'}">control, modify — 회원 조회/수정/관제·탐지</option>
                    <option value="master" th:selected="${permissionRole == 'master'}">master — 회원 조회/수정, 관제·탐지 및 권한 관리</option>
                </select>
                <small>master 권한은 동시에 한 명에게만 부여할 수 있습니다.</small>
            </div>
            <div class="form-actions">
                <button class="button button-primary" type="submit">권한 저장</button>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
</body>
</html>
