<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <header th:fragment="header">
        <div id="header_wrap">
            <h3>소방전용 구역주차 및 진입로 차량 감지·관제 시스템</h3>
        </div>
    </header>

    <nav th:fragment="nav">
        <div id="nav_wrap">
            <a th:href="@{/}">HOME</a>

            <!-- 로그인 전 승인 상태 확인 -->
            <th:block sec:authorize="!hasAnyRole('ADMIN', 'SUPER_ADMIN')">
                <a th:href="@{/admin/signup}">관리자 가입</a>
                <a th:href="@{/admin/signin}">로그인</a>
                <a th:href="@{/admin/findpassword}">비밀번호 찾기</a>
            </th:block>

            <!-- 로그인 후 목록 -->
            <th:block sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN')">
                <a sec:authorize="hasAnyRole('CONTROL', 'MASTER')" th:href="@{/dashboard/monitoring}">관제화면</a>
                <a sec:authorize="hasAnyRole('CONTROL', 'MASTER')" th:href="@{/dashboard/detection}">탐지 목록</a>
                <a sec:authorize="hasAnyRole('CONTROL', 'MODIFY', 'MASTER')"
                   th:href="@{/admin/members_list}">회원 조회</a>
                <a th:href="@{/admin/myinfocheck}">내 정보 조회</a>

                <!-- 경보 소리 켜기/끄기 : 관제 권한(CONTROL, MASTER)만, 모든 화면에서 로그아웃 왼쪽 -->
                <button type="button"
                        id="alarm_sound_btn"
                        aria-pressed="false"
                        sec:authorize="hasAnyRole('CONTROL', 'MASTER')">경보 소리 켜기</button>

                <form th:action="@{/admin/logout}"
                      method="post"
                      style="display: inline;">
                    <button type="submit">로그아웃</button>
                </form>
            </th:block>
        </div>

        <!-- 경보 소리 + 경보 팝업 공통 기능 (모든 화면, 관제 화면을 볼 수 있는 권한만) -->
        <link sec:authorize="hasAnyRole('CONTROL', 'MASTER')" rel="stylesheet" th:href="@{/css/dashboard/alarm.css}">
        <script sec:authorize="hasAnyRole('CONTROL', 'MASTER')" th:src="@{/js/dashboard/alarm.js}"></script>
    </nav>

    <footer th:fragment="footer">
        <div id="footer_wrap">
            Copyright OFFICE Corp. ALL Rights Reserved.
        </div>
    </footer>

</html>
