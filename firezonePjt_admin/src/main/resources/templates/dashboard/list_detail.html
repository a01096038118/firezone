<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard/list_detail.css}">

    <script th:src="@{/js/dashboard/common.js}"></script>
    <script th:src="@{/js/dashboard/list_detail.js}"></script>

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}"/>

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>


<section id="list_wrap">
    <!-- 탐지 상세 정보 -->
    <div class="list">
        <h2>탐지 정보</h2>

        <!-- 불러오는 중, 오류 안내 -->
        <p id="detail_message">탐지 정보를 불러오는 중입니다.</p>

        <div id="detail_content" hidden>

            <div class="detection_img">
                <img id="detection_img" alt="탐지된 차량 사진" hidden>
                <p id="image_message">이미지를 불러오는 중입니다.</p>
            </div>

            <p id="summary_message"></p>

            <div class="list_info">
                <dl>
                    <dt>탐지 번호</dt>
                    <dd id="detection_no">-</dd>

                    <dt>카메라 ID</dt>
                    <dd id="camera_id">-</dd>

                    <dt>탐지 구역 ID</dt>
                    <dd id="zone_id">-</dd>

                    <dt>위반 유형</dt>
                    <dd id="violation_type">-</dd>

                    <dt>차량 번호</dt>
                    <dd id="car_number">-</dd>

                    <dt>최초 탐지 시간</dt>
                    <dd id="first_detected">-</dd>

                    <dt>마지막 탐지 시간</dt>
                    <dd id="last_detected">-</dd>

                    <dt>주정차 시간</dt>
                    <dd id="duration">-</dd>
                </dl>

                <button type="button" id="delete_button">삭제</button>
            </div>
        </div>

        <a th:href="@{/dashboard/detection}">탐지 목록</a>
    </div>
</section>


<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
