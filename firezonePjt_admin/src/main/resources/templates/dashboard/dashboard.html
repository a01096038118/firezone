<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard/dashboard.css}">

    <script th:src="@{/js/dashboard/common.js}"></script>
    <script th:src="@{/js/dashboard/dashboard.js}"></script>

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}"/>

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>


    <section id="dashboard_wrap">
        <!-- 실시간 관제 화면 -->
        <div class="monitoring">
            <h2>실시간 관제</h2>

            <div class="camera_info">
                <span class="camera_id">-</span>
                <span class="zone_no">-</span>
                <span class="connection_status">연결대기</span>
            </div>

            <div class="stream_area">
                <img id="live_stream" alt="실시간 관제 영상" hidden>
                <p id="stream_message">연결 대기 중</p>
            </div>

        </div>

        <!-- 실시간 탐지 -->
        <div class="detection_log">

            <div class="detection_img">
                <img id="detection_img" alt="탐지된 차량 사진" hidden>
            </div>

            <dl class="detection_info">
                <dt>카메라 ID</dt>
                <dd id="detection_camera_id">-</dd>
                <dt>탐지 구역</dt>
                <dd id="zone_id">-</dd>

                <dt>위반 유형</dt>
                <dd id="violation_type">-</dd>

                <dt>차량 번호</dt>
                <dd id="car_number">-</dd>

                <dt>최초 탐지 시간</dt>
                <dd id="first_detected">-</dd>

                <dt>마지막 탐지 시간</dt>
                <dd id="last_detected">-</dd>
            </dl>

            <a id="detection_detail_link" hidden>탐지 상세 정보</a>

        </div>

        <!-- 경보 알람 -->
        <section class="alarm_area">
            <h3>경보</h3>
            <!-- 경보 소리 버튼은 모든 화면 공통으로 nav에 있음 (include/header_nav_footer.html, js/dashboard/alarm.js) -->
        </section>

        <!-- 경보 팝업 (내용은 js/dashboard/alarm.js가 채움, 다른 화면에서는 alarm.js가 직접 만듦) -->
        <div id="alarm_popup_area"></div>


        <!-- 최근 탐지 목록 -->
        <table>
            <thead>
            <tr>
                <th>카메라 ID</th>
                <th>탐지 구역</th>
                <th>차량 번호</th>
                <th>최초 탐지 시간</th>
            </tr>
            </thead>

            <tbody id="detection_log_list">
                <tr>
                    <td colspan="4"> 탐지 정보를 불러오는 중입니다.</td>
                </tr>
            </tbody>
        </table>

    </section>


<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
