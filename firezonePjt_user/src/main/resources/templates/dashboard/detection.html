<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard/detection.css}">

    <script th:src="@{/js/dashboard/common.js}"></script>
    <script th:src="@{/js/dashboard/detection.js}"></script>

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}"/>

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>


<section id="detection_wrap">
    <div class="detection">
        <h2>탐지 목록</h2>

        <!-- 탐지 목록 -->
        <div class="detections">

            <div class="detction_info">
                <table>
                    <thead>
                    <tr>
                        <th>탐지 구역</th>
                        <th>위반 유형</th>
                        <th>차량 번호</th>
                        <th>최초 탐지 시간</th>
                        <th>마지막 탐지 시간</th>
                    </tr>
                    </thead>

                    <tbody id="detection_log_list">
                    <tr>
                        <td colspan="5">탐지 기록을 불러오는 중입니다.</td>
                    </tr>
                    </tbody>

                </table>

                <!-- 페이지 이동 -->
                <div class="pagination">
                    <button type="button" id="prev_page">이전</button>
                    <span id="page_info">1 / 1</span>
                    <button type="button" id="next_page">다음</button>
                </div>

            </div>
        </div>
    </div>

</section>


<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
