<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <header th:fragment="header">
        <div id="header_wrap">
            <h3>소방전용 구역주차 및 진입로 차량 감지·관제 시스템</h3>
        </div>
    </header>

    <nav th:fragment="nav">
        <div id="nav_wrap">
            <a th:href="@{/}">HOME</a>

            <!-- 로그인 전 승인 상태 확인 -->
            <th:block sec:authorize="!hasAnyRole('PRE_USER', 'APPR_USER', 'USER')">
                <a th:href="@{/member/signup}">회원가입</a>
                <a th:href="@{/member/signin}">로그인</a>
                <a th:href="@{/member/findpassword}">비밀번호 찾기</a>
            </th:block>

            <!-- 로그인 후 목록 -->
            <th:block sec:authorize="hasAnyRole('APPR_USER', 'USER')">
                <a th:href="@{/dashboard/monitoring}">관제화면</a>
                <a th:href="@{/dashboard/detection}">탐지 목록</a>
                <a th:href="@{/member/modify}">내 정보 조회</a>

                <!-- 경보 소리 켜기/끄기 : 모든 화면에서 로그아웃 왼쪽 -->
                <button type="button"
                        id="alarm_sound_btn"
                        aria-pressed="false">경보 소리 켜기</button>

                <form th:action="@{/member/signout_confirm}"
                      method="post"
                      style="display: inline;">
                    <button type="submit">로그아웃</button>
                </form>
            </th:block>
        </div>

        <!-- 경보 소리 공통 기능 (관제 화면을 볼 수 있는 회원만) -->
        <script sec:authorize="hasAnyRole('APPR_USER', 'USER')" th:src="@{/js/alarm.js}"></script>
    </nav>

    <footer th:fragment="footer">
        <div id="footer_wrap">
            Copyright OFFICE Corp. ALL Rights Reserved.
        </div>
    </footer>

</html>
