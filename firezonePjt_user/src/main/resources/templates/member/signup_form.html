<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

    <script th:src="@{/js/member.js}"></script>

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}" />

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>

<section>
    <div id="section_wrap">
        <div class="word">
            SIGN-UP FORM
        </div>
        <div class="content">
            <form
            th:action="@{/member/signup_confirm}"
            name="signup_form"
            th:attr="data-id-check-url=@{/member/id-check}"
            method="post">

                <input type="text" name="um_id" placeholder="INPUT NEW MEMBER ID" oninput="resetMemberIdCheck()">
                <button type="button" onclick="checkMemberId()">아이디 중복확인</button><br>
                <span id="member-id-check-message" aria-live="polite"></span><br>
                <input type="password" name="um_pw" placeholder="INPUT NEW MEMBER PW"><br>
                <input type="email" name="um_name" placeholder="INPUT NEW MEMBER NAME"><br>
                <input type="email" name="um_mail" placeholder="INPUT NEW MEMBER MAIL"><br>
                <input type="text" name="um_phone" placeholder="INPUT NEW MEMBER PHONE"><br>
                <input type="button" value="sign-up" onclick="signupForm();">
                <input type="reset" value="reset">

            </form>
        </div>
    </div>
</section>

<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
