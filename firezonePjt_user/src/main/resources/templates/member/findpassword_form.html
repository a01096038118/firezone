<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

    <script th:src="@{/js/member.js}"></script>

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}" />

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>

<section>
    <div id="section_wrap">
        <div class="word">
            FINDPASSWORD FORM
        </div>
        <div class="content">
            <form
                th:action="@{/member/findpassword_confirm}"
                name="findpassword_form"
                method="post">
                <input type="text" name="um_id" placeholder="INPUT MEMBER ID" required><br>
                <input type="password" name="um_mail" placeholder="INPUT MEMBER MAIL" required><br>
                <input type="button" value="비밀번호 찾기" onclick="findpasswordForm();">
                <input type="reset" value="초기화">
            </form>
        </div>
    </div>
</section>

<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
