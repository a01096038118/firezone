<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:replace="~{/include/title.html::title}"/>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/member.css}">

    <script th:src="@{/js/member.js}"></script>

</head>
<body>

<header th:replace="~{/include/header_nav_footer.html::header}" />

<nav th:replace="~{/include/header_nav_footer.html::nav}"/>

<section>
    <div id="section_wrap">
        <div class="word">
            내 정보 조회 / 수정
        </div>
        <div class="content">
            <p th:if="${errorMessage}" th:text="${errorMessage}"></p>
            <form
            th:action="@{/member/modify_confirm}"
            name="modify_form"
            method="post">

                <label>아이디
                    <input type="text" th:value="${loginedMemberDto.um_id}" readonly><br>
                </label>
                <label>이름
                    <input type="text" name="um_name" th:value="${loginedMemberDto.um_name}" required><br>
                </label>
                <label>이메일
                    <input type="email" name="um_mail" th:value="${loginedMemberDto.um_mail}" required><br>
                </label>
                <label>연락처
                    <input type="text" name="um_phone" th:value="${loginedMemberDto.um_phone}" required><br>
                </label>
                <label>비밀번호
                    <input type="password" name="um_pw" placeholder="변경할 때만 입력"><br>
                </label>
                <p th:if="${loginedMemberDto.um_reg_date != null}">
                    가입일: <span th:text="${loginedMemberDto.um_reg_date}"></span>
                </p>
                <p th:if="${loginedMemberDto.um_mod_date != null}">
                    최근 수정일: <span th:text="${loginedMemberDto.um_mod_date}"></span>
                </p>
                <input type="button" value="modify" onclick="modifyForm();">
                <input type="reset" value="reset">

            </form>

            <section class="danger-zone">
                <h3>회원 탈퇴</h3>
                <p>탈퇴하려면 현재 비밀번호를 입력해 주세요. 탈퇴한 계정은 복구할 수 없습니다.</p>
                <form th:action="@{/member/withdraw}"
                      method="post"
                      onsubmit="return confirm('정말 탈퇴하시겠습니까? 계정을 복구할 수 없습니다.');">
                    <label for="withdraw-password">현재 비밀번호</label>
                    <input id="withdraw-password"
                           type="password"
                           name="currentPassword"
                           autocomplete="current-password"
                           required>
                    <button type="submit">회원 탈퇴</button>
                </form>
            </section>
        </div>
    </div>
</section>

<footer th:replace="~{/include/header_nav_footer.html::footer}"/>

</body>
</html>
